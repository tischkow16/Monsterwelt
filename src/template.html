<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monsterwelt</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14161c;color:#222;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;padding:8px}
#game{position:relative;width:min(96vw,calc((100vh - 16px) * 240 / 176),960px);aspect-ratio:240/176;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6);font-size:var(--fs,16px)}
body.touch #game{width:min(98vw,calc((100vh - 230px) * 240 / 176),960px)}
canvas#screen{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
/* Dialog */
#msg{position:absolute;left:1.5%;right:1.5%;bottom:2%;height:25%;background:#fdfdf8;border:.22em solid #2d3142;border-radius:.6em;box-shadow:inset 0 0 0 .18em #b9c0d6;padding:.55em .9em;font-size:1.05em;line-height:1.35;display:none;z-index:30;white-space:pre-wrap;font-weight:600;color:#1f2233}
#msg .more{position:absolute;right:.7em;bottom:.35em;font-size:.8em;color:#d33;animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
#choices{position:absolute;right:1.5%;bottom:29%;min-width:34%;max-width:70%;max-height:68%;overflow-y:auto;background:#fdfdf8;border:.22em solid #2d3142;border-radius:.6em;box-shadow:inset 0 0 0 .18em #b9c0d6;padding:.35em .3em;display:none;z-index:31;font-weight:600;color:#1f2233}
#choices .opt{padding:.28em .6em .28em 1.3em;position:relative;border-radius:.3em;cursor:pointer;display:flex;align-items:center;gap:.5em}
#choices .opt.sel{background:#e3e8ff}
#choices .opt.sel::before{content:"▶";position:absolute;left:.3em;font-size:.75em;color:#d33}
#choices .opt.dis{color:#999}
#choices .title{font-size:.8em;color:#667;padding:.1em .6em .3em}
#choices.grid{display:none;grid-template-columns:1fr 1fr;left:40%;right:1.5%;max-width:none;min-width:0;bottom:29%}
#choices.grid.show{display:grid}
#choices.grid .title{grid-column:1/-1}
.tbadge{display:inline-block;font-size:.68em;padding:.05em .45em;border-radius:.6em;color:#fff;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.35);vertical-align:middle}
.small{font-size:.75em;color:#556;font-weight:600}
/* Panel */
#panel{position:absolute;inset:3% 3% 29% 3%;background:#fdfdf8;border:.22em solid #2d3142;border-radius:.6em;display:none;z-index:25;padding:.7em .9em;overflow-y:auto;color:#1f2233}
#panel.full{bottom:3%}
#panel h2{margin:0 0 .3em;font-size:1.2em}
#panel table{border-collapse:collapse;width:100%;font-size:.85em}
#panel td{padding:.15em .3em;border-bottom:1px solid #e4e6ee}
.statbar{height:.55em;background:#e4e6ee;border-radius:.3em;overflow:hidden;width:8em;display:inline-block;vertical-align:middle}
.statbar i{display:block;height:100%;background:#5b8def}
/* Battle */
#battle{position:absolute;inset:0;display:none;z-index:20;overflow:hidden}
#battle .bg{position:absolute;inset:0}
.plat{position:absolute;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.28),rgba(0,0,0,.08) 60%,transparent 70%)}
#foePlat{right:8%;top:30%;width:34%;height:12%}
#mePlat{left:4%;top:60%;width:40%;height:13%}
.mon{position:absolute;image-rendering:pixelated;z-index:3}
.trainer{position:absolute;image-rendering:pixelated;z-index:4;display:none}
#meTrainer{left:4%;top:22%;width:28%}
#foeTrainer{right:10%;top:-2%;width:24%}
#ball{position:absolute;width:4.8%;aspect-ratio:1;border-radius:50%;border:.15em solid #1d1f2a;display:none;z-index:6;transform:translate(-50%,-50%);box-shadow:0 0 .4em rgba(255,255,255,.7)}
#fxc{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:7}
#fx{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.ptc{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.proj{position:absolute;transform:translate(-50%,-50%);font-size:1.8em;filter:drop-shadow(0 0 .35em var(--c,#fff)) drop-shadow(0 0 .2em #fff)}
.ftxt{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:1.25em;white-space:nowrap;text-shadow:0 .08em 0 #fff,0 0 .3em #fff,0 0 .2em #fff}
#battle .info{z-index:8}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -3%}}
#foeMon{animation:bob 2.4s ease-in-out infinite}
#meMon{animation:bob 2.9s ease-in-out infinite}
#foeMon.shake,#meMon.shake{animation:shake .35s}
#foeMon.flash,#meMon.flash{animation:flash .4s}
#meMon.lunge-me{animation:lungeMe .3s}
#foeMon.lunge-foe{animation:lungeFoe .3s}
#trans{position:absolute;inset:0;z-index:45;display:none;pointer-events:none;overflow:hidden}
#trans .tbar{position:absolute;background:#000}
#saveToast{position:absolute;left:50%;top:3%;transform:translateX(-50%);background:rgba(29,31,42,.85);color:#fff;font-weight:700;font-size:.8em;padding:.25em .8em;border-radius:1em;z-index:55;opacity:0;transition:opacity .3s;pointer-events:none}
#foeMon{right:13%;top:2%;width:24%}
#meMon{left:9%;top:22%;width:30%}
.info{position:absolute;background:#fdfdf8;border:.2em solid #2d3142;border-radius:.5em;padding:.3em .6em;font-weight:700;color:#1f2233;min-width:38%}
#foeInfo{left:3%;top:11%}
#partyBar{position:absolute;left:0;right:0;top:0;height:8.5%;display:none;justify-content:space-between;align-items:center;padding:0 2.5%;background:linear-gradient(rgba(20,22,34,.82),rgba(20,22,34,.55));color:#fff;font-weight:700;font-size:.72em;z-index:9;pointer-events:none}
#partyBar.solo{justify-content:flex-start}
#partyBar .pside{display:flex;align-items:center;gap:.25em}
#partyBar .pside b{letter-spacing:.05em;margin:0 .3em}
.pb{display:inline-block;width:.95em;height:.95em;border-radius:50%;border:.12em solid #1d1f2a;background:linear-gradient(#e74c3c 0 45%,#1d1f2a 45% 55%,#fff 55%);box-shadow:0 0 0 .08em rgba(255,255,255,.5)}
.pb.st{background:linear-gradient(var(--sc) 0 45%,#1d1f2a 45% 55%,#fff 55%);box-shadow:0 0 .35em var(--sc)}
.pb.down{background:#6b6f80;opacity:.75;filter:grayscale(1)}
.pb.empty{background:transparent;border-color:rgba(255,255,255,.3);box-shadow:none}
.stag{display:inline-block;font-size:.68em;color:#fff;padding:.05em .35em;border-radius:.3em;vertical-align:middle;letter-spacing:.04em;font-weight:800}
#poisonHud{position:absolute;left:2%;top:3%;z-index:15;background:rgba(80,20,110,.9);color:#fff;font-weight:800;font-size:.8em;padding:.3em .7em;border-radius:.5em;border:.15em solid #d6a2f0;line-height:1.35;pointer-events:none}
#poisonHud.urgent{background:rgba(170,20,30,.92);border-color:#ffb3b3;animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#meInfo{right:3%;top:38%}
.info .nm{display:flex;justify-content:space-between;gap:1em;font-size:.95em}
.hpw{display:flex;align-items:center;gap:.35em;font-size:.7em;margin-top:.2em}
.hp{flex:1;height:.7em;background:#3a3d4a;border-radius:.4em;overflow:hidden;border:.12em solid #3a3d4a}
.hp i{display:block;height:100%;width:100%;background:#3ccf6a;transition:width .7s ease-out,background .3s}
.xp{height:.3em;background:#ccd;border-radius:.2em;overflow:hidden;margin-top:.25em}
.xp i{display:block;height:100%;background:#4aa3ff;transition:width .8s ease-out}
.hpnum{font-size:.75em;text-align:right;margin-top:.1em}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
.flash{animation:flash .4s}
@keyframes flash{0%,100%{filter:none}50%{filter:brightness(3)}}
.lunge-me{animation:lungeMe .3s}
@keyframes lungeMe{50%{transform:translate(10%,-6%)}}
.lunge-foe{animation:lungeFoe .3s}
@keyframes lungeFoe{50%{transform:translate(-10%,6%)}}
/* fade */
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
#fade.white{background:#fff}
#mapname{position:absolute;left:2%;top:3%;background:#fdfdf8;border:.2em solid #2d3142;border-radius:.4em;padding:.25em .8em;font-weight:700;z-index:15;transition:opacity .4s;opacity:0;color:#1f2233}
#hud{position:absolute;right:2%;top:3%;z-index:15;display:flex;gap:.4em}
#hud button.on{background:#ffd84a;box-shadow:0 0 .4em #ffb300}
#hud button{font:inherit;font-size:.8em;font-weight:700;background:rgba(253,253,248,.92);border:.15em solid #2d3142;border-radius:.4em;padding:.2em .6em;cursor:pointer;color:#1f2233}
/* title */
#title{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;background:linear-gradient(#5fb0ff,#a9e3ff 55%,#7cd66b 55%,#4fae4a);color:#fff;text-align:center}
#title h1{margin:0;font-size:3em;letter-spacing:.06em;text-shadow:0 .08em 0 #1d3b7a,0 0 .4em rgba(0,0,0,.25);font-weight:900}
#title .sub{font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#title .mons{display:flex;gap:1em}
#title .mons canvas{width:4.5em;image-rendering:pixelated;filter:drop-shadow(0 .2em .1em rgba(0,0,0,.3))}
#title button,#title input{font:inherit;font-weight:800;font-size:1em;padding:.4em 1.2em;border-radius:.5em;border:.18em solid #2d3142;background:#fdfdf8;color:#1f2233;cursor:pointer;min-width:12em}
#title input{cursor:text;text-align:center}
#title button:hover{background:#fff3c4}
#title .row{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}
#title .hint{font-size:.7em;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.5);font-weight:600}
/* touch controls */
#pad{display:none;width:min(98vw,520px);justify-content:space-between;align-items:center;padding:0 6px}
body.touch #pad{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:2px}
.dpad div,.btns div{background:#2d3142;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:10px;font-size:20px;touch-action:none}
.dpad div:active,.btns div:active,.dpad div.on,.btns div.on{background:#4a5170}
.btns{display:flex;gap:8px;align-items:center}
.btns .ab{width:58px;height:58px;border-radius:50%;font-size:22px}
.btns .a{background:#c0392b}
.btns .menu{width:44px;height:34px;font-size:14px}
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="screen" width="240" height="176"></canvas>
    <div id="mapname"></div>
    <div id="hud"><button id="mapBtn" style="display:none">🗺️</button><button id="turboBtn" style="display:none">👟</button><button id="bikeBtn" style="display:none">🚲 Fahrrad</button><button id="menuBtn">☰ Menü</button></div>
    <div id="battle">
      <div class="bg" id="bbg"></div>
      <div class="plat" id="foePlat"></div>
      <div class="plat" id="mePlat"></div>
      <canvas class="mon" id="foeMon" width="32" height="32"></canvas>
      <canvas class="mon" id="meMon" width="32" height="32"></canvas>
      <canvas class="trainer" id="meTrainer" width="18" height="18"></canvas>
      <canvas class="trainer" id="foeTrainer" width="18" height="18"></canvas>
      <div id="ball"></div>
      <div id="partyBar"></div>
      <canvas id="fxc"></canvas>
      <div id="fx"></div>
      <div class="info" id="foeInfo"><div class="nm"><span id="foeName"></span><span id="foeLv"></span></div><div id="foeTypes"></div><div class="hpw">KP<div class="hp"><i id="foeHp"></i></div></div></div>
      <div class="info" id="meInfo"><div class="nm"><span id="meName"></span><span id="meLv"></span></div><div class="hpw">KP<div class="hp"><i id="meHp"></i></div></div><div class="hpnum" id="meHpNum"></div><div class="xp"><i id="meXp"></i></div></div>
    </div>
    <div id="panel"></div>
    <div id="choices"></div>
    <div id="msg"></div>
    <div id="trans"></div>
    <div id="saveToast"></div>
    <div id="poisonHud" style="display:none"></div>
    <div id="fade"></div>
    <div id="title">
      <h1>MONSTERWELT</h1>
      <div class="sub">Ein Abenteuer voller Elemente</div>
      <div class="mons" id="titleMons"></div>
      <div id="titleMain" class="row"></div>
      <div class="hint">Steuerung: Pfeiltasten/WASD bewegen · Enter/Leertaste = A · Esc/X = B/Menü · Shift halten = rennen · R = Fahrrad</div>
    </div>
  </div>
  <div id="pad">
    <div class="dpad">
      <span></span><div data-k="up">▲</div><span></span>
      <div data-k="left">◀</div><span></span><div data-k="right">▶</div>
      <span></span><div data-k="down">▼</div><span></span>
    </div>
    <div class="btns">
      <div class="menu" data-k="MENU">☰</div>
      <div class="ab b" data-k="B">B</div>
      <div class="ab a" data-k="A">A</div>
    </div>
  </div>
</div>
<script>
/*GAME*/
</script>
</body>
</html>
