name: Server deployen
on:
  # Normalerweise lädt Cloudflare den Server selbst hoch (Git-Verbindung). Diesen Weg nur manuell starten.
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wrangler installieren
        run: npm ci
        working-directory: server
      - name: Monsterwelt-Server zu Cloudflare hochladen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
